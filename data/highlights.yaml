working_papers:
  - title: "„Stop-and-Go“ in Reaction-Videos: multimodale Herstellung und Organisation digitaler Zeitlichkeit"
    authors: "Carolin Dix & Daniel Pfurtscheller"
    affiliation: "Universität Innsbruck"
    note: "Erscheint in: „Zeitlichkeit und digitale Kommunikation“, Buchreihe «Digitale Linguistik» (hrsg. von Jannis Androutsopoulos und Konstanze Marx), Metzler Verlag. Herausgegeben von Florian Busch, Karina Frick, Jasmin Lallo und Julie Täge."
  - title: "Das Medienspezifische – ein unterbestimmtes, aber analytisch brauchbares Konzept in der medienlinguistischen Forschung"
    authors: "Daniel Pfurtscheller & Ina Pick"
    affiliation: "Universität Innsbruck; Universität Bielefeld"
    note: "Für das offene Themenheft „Quo vadis, Medienlinguistik?“ des jfml (Journal für Medienlinguistik) in Überarbeitung."
  - title: "Sorting methods in visual research: Strengths and limitations for visual data analysis and visual sense-making"
    authors: "Katharina Lobinger, Daniel Pfurtscheller & T J Thomson"
    affiliation: "Università della Svizzera italiana, Lugano; Universität Innsbruck; RMIT University, Melbourne"
    note: "Erscheint in: The Routledge International Handbook of Visual Inquiry: Methods and Pedagogies for Visual Literacy, hg. von Dana S. Thompson und Ricardo López-León. Taylor & Francis."
