{{ define "main" }}
  <article class="wrap article tools-page" lang="en">
    <header class="article-header">
      <h1>{{ .Title }}</h1>
      <p>{{ .Description }}</p>
    </header>
    <ul class="tools-grid" role="list">
      {{ range .Params.tools }}
        <li class="tool-card">
          <h2>{{ .name }}</h2>
          <p class="tool-card-description">{{ .description }}</p>
          <p class="tool-card-status">{{ .status }}</p>
          <a class="tool-card-link" href="{{ .url }}">Try {{ .name }} <span aria-hidden="true">↗</span></a>
        </li>
      {{ end }}
    </ul>
  </article>
{{ end }}
